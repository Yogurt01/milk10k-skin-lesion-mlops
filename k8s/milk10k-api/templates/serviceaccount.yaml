{{- if .Values.serviceAccount.create }}
# Identity of the API Pods. On GKE, Workload Identity Federation maps it (namespace + name) to read access on the
# model bucket (deploy/terraform/main.tf); it has no Kubernetes permissions and no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "milk10k-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "milk10k-api.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
