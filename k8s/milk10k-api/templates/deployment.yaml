{{- $gcs := eq .Values.model.source "gcs" }}
{{- if not (or $gcs (eq .Values.model.source "hostPath")) }}
{{- fail (printf "model.source %q is not implemented; use hostPath or gcs" .Values.model.source) }}
{{- end }}
{{- if and $gcs (not .Values.serviceAccount.create) }}
{{- fail "model.source gcs reads the bucket with Workload Identity: set serviceAccount.create=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "milk10k-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "milk10k-api.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
  template:
    metadata:
      labels:
        {{- include "milk10k-api.labels" . | nindent 8 }}
    spec:
      # The API never talks to the Kubernetes API.
      automountServiceAccountToken: false
      {{- if .Values.serviceAccount.create }}
      # Its own ServiceAccount: the identity Workload Identity maps to bucket read access (no token is mounted; the
      # GKE metadata server answers the init container's credential requests).
      serviceAccountName: {{ include "milk10k-api.serviceAccountName" . }}
      {{- end }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if or $gcs .Values.model.verifyInInitContainer }}
      initContainers:
        {{- if $gcs }}
        # Copies the package from the private bucket into the Pod's own volume. Credentials come from Workload
        # Identity (no key file); verify-model then checks every sha256 before the API starts.
        - name: fetch-model
          image: {{ include "milk10k-api.fetchImage" . }}
          imagePullPolicy: IfNotPresent
          command:
            - gcloud
            - storage
            - cp
            - --recursive
            - {{ printf "gs://%s/%s/*" (required "model.gcs.bucket is required when model.source is gcs" .Values.model.gcs.bucket) .Values.model.gcs.prefix | quote }}
            - {{ .Values.model.mountPath | quote }}
          env:
            - name: CLOUDSDK_CONFIG
              value: /gcloud
            - name: CLOUDSDK_CORE_DISABLE_PROMPTS
              value: "1"
            - name: CLOUDSDK_CORE_DISABLE_USAGE_REPORTING
              value: "true"
            - name: CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK
              value: "true"
          securityContext:
            {{- include "milk10k-api.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.model.gcs.resources | nindent 12 }}
          volumeMounts:
            - name: model
              mountPath: {{ .Values.model.mountPath }}
            - name: gcloud-config
              mountPath: /gcloud
            - name: tmp
              mountPath: /tmp
        {{- end }}
        {{- if .Values.model.verifyInInitContainer }}
        - name: verify-model
          image: {{ include "milk10k-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import os, sys
              from pathlib import Path
              from milk10k_serving.package import ModelPackageError, verify_package
              try:
                  manifest = verify_package(Path(os.environ["MODEL_DIR"]), verify_sha256=True)
              except ModelPackageError as exc:
                  print(f"sha256 check FAILED: {exc}", flush=True)
                  sys.exit(1)
              print(f"sha256 check passed: {len(manifest['files'])} files match manifest.json", flush=True)
          env:
            - name: MODEL_DIR
              value: {{ .Values.model.mountPath | quote }}
            - name: ORT_DISABLE_TELEMETRY
              value: "1"
          securityContext:
            {{- include "milk10k-api.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: model
              mountPath: {{ .Values.model.mountPath }}
              readOnly: true
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "milk10k-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL_DIR
              value: {{ .Values.model.mountPath | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          securityContext:
            {{- include "milk10k-api.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          volumeMounts:
            - name: model
              mountPath: {{ .Values.model.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model
          {{- if $gcs }}
          # The Pod's own copy (~1.4 GB) on the node's disk, removed with the Pod.
          emptyDir:
            sizeLimit: {{ .Values.model.gcs.sizeLimit }}
          {{- else }}
          hostPath:
            path: {{ .Values.model.hostPath }}
            type: Directory
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
        {{- if $gcs }}
        # gcloud's configuration and token cache, seen by fetch-model only.
        - name: gcloud-config
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- end }}
