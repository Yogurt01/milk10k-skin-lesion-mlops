# Repository-wide tool configuration only. The installable packages have their own pyproject.toml:
# training/ (milk10k, the released model, kept unchanged) and serving/ (milk10k_serving).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests that need no model files",
    "api: FastAPI tests with a fake predictor (no model files)",
    "parity: needs the model package and the sample lesions; compares with the stored reference predictions",
    "slow: loads or copies the full model package",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["training", "artifacts", "**/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["milk10k_serving"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
