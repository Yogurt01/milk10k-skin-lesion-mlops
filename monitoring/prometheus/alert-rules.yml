# Alert rules (P1-OBS-08), evaluated by Prometheus; visible at http://127.0.0.1:9090/alerts.
# No Alertmanager in the local stack: alerts are shown in Prometheus only (no notifications).
groups:
  - name: milk10k-api
    rules:
      # Two cases (P1-OBS-11): a known target that cannot be scraped (up == 0, labels per instance), and no api
      # target at all: DNS discovery of `api` finds no container (e.g. `docker compose rm -sf api`), so the `up`
      # series go stale and only absent() sees it (labels: job="api", no instance).
      - alert: ApiDown
        expr: up{job="api"} == 0 or absent(up{job="api"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ if $labels.instance }}API target {{ $labels.instance }} cannot be scraped{{ else
            }}No API target in Prometheus{{ end }}
          description: >-
            {{ if $labels.instance }}Prometheus has not reached /metrics of {{ $labels.instance }} for 1 minute.{{ else
            }}Service discovery has found no api container for 1 minute.{{ end }}

      # The process answers /metrics, but the model package is not loaded: /predict returns 503. A load takes
      # 2.4-3.2 s (load_seconds measured in P1-DCK-02 and P1-DCK-07); 2 minutes is well above that and above the
      # container healthcheck's 60 s start period, so only a failed or stuck load fires, not a normal start.
      # When the API is down the series is absent and ApiDown fires instead.
      - alert: ApiModelNotReady
        expr: milk10k_model_ready{job="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Model not loaded on API target {{ $labels.instance }}"
          description: "milk10k_model_ready has been 0 for 2 minutes on {{ $labels.instance }}; /ready shows the load error."

      # Share of /predict responses with a 5xx status, including 503 (model not ready, or busy: the limiter's queue
      # was full). Needs some traffic: with no /predict requests the ratio is empty and the alert stays inactive.
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(milk10k_http_requests_total{route="/predict", status=~"5.."}[1m]))
            / sum(rate(milk10k_http_requests_total{route="/predict"}[1m])) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of /predict responses are 5xx"
          description: "5xx share of /predict over the last minute: {{ $value | humanizePercentage }}."

      # p95 latency of /predict. One prediction takes ~0.6 s (docs/serving_measurements.md); a p95 above 3 s means
      # requests wait in the queue (or the host is overloaded).
      - alert: ApiHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(milk10k_http_request_duration_seconds_bucket{route="/predict"}[5m]))) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency of /predict above 3 s"
          description: "p95 of /predict over 5 minutes: {{ $value | humanizeDuration }}."
